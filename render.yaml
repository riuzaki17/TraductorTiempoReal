services:
  - type: web
    name: voicemeet-translate
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: LIBRETRANSLATE_URL
        value: https://libretranslate.com
      - key: LIBRETRANSLATE_API_KEY
        sync: false # se introduce manualmente en el dashboard de Render, no se commitea (gratis: portal.libretranslate.com)
      - key: NODE_VERSION
        value: 22.14.0
