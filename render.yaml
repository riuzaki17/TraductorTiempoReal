services:
  - type: web
    name: voicemeet-translate
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      # Sin variables de traduccion: por defecto usa MyMemory (gratis, sin key, ver server/translate.js).
      # Si tienes tu propio LibreTranslate self-hosted, puedes apuntar aqui:
      # - key: LIBRETRANSLATE_URL
      #   value: https://tu-instancia-propia.example.com
