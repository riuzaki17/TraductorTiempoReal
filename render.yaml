services:
  - type: web
    name: voicemeet-translate
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: LIBRETRANSLATE_URL
        fromService:
          type: web
          name: voicemeet-libretranslate
          property: hostport
      # Sin esta variable, el servidor cae automaticamente a MyMemory (gratis, sin key,
      # pero con cuota compartida poco fiable en IPs de hosting). Con el servicio de
      # abajo, la traduccion es propia, local al contenedor, sin limite de terceros.

  - type: web
    name: voicemeet-libretranslate
    runtime: image
    plan: free
    image:
      url: docker.io/libretranslate/libretranslate:latest
    envVars:
      - key: LT_LOAD_ONLY
        value: es,en,fr,de,it,pt,ja
      - key: LT_DISABLE_WEB_UI
        value: "true"
